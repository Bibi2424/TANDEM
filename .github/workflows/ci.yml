name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/_checks.yml
    permissions:
      contents: read
      checks: write
      pull-requests: write
    with:
      run-coverage: true
      publish-test-report: true

  firmware-builds:
    name: Firmware Builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PlatformIO
        uses: ./.github/actions/setup-platformio
        with:
          cache-key: ${{ runner.os }}-pio-fw-${{ hashFiles('firmware/platformio.ini') }}
          cache-restore-keys: ${{ runner.os }}-pio-fw-

      - name: Cache PlatformIO build objects
        uses: actions/cache@v4
        with:
          path: ~/.pio-build-cache
          key: ${{ runner.os }}-pio-build-cache-${{ hashFiles('firmware/platformio.ini', 'tools/git_version.py') }}

      - name: Build default firmware environments
        run: |
          mkdir -p "$HOME/.pio-build-cache"
          PLATFORMIO_BUILD_CACHE_DIR="$HOME/.pio-build-cache" pio run -d firmware
