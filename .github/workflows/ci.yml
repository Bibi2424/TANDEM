name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-tests:
    name: Native Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO & pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-native-${{ hashFiles('platformio.ini', 'lib/**/library.json') }}
          restore-keys: |
            ${{ runner.os }}-pio-native-

      - name: Install PlatformIO & gcovr
        run: python -m pip install --upgrade pip platformio gcovr

      - name: Run native unit tests
        run: |
          mkdir -p test-results
          pio test -e native -v --junit-output-path test-results/junit.xml

      - name: Publish unit test results
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Native Unit Test Results
          path: "test-results/**/*.xml"
          reporter: java-junit
          list-tests: all
          fail-on-error: "false"

      - name: Run native coverage tests
        run: |
          rm -rf .pio/build/native_cov
          pio test -e native_cov

      - name: Generate tandem_core coverage report
        run: |
          mkdir -p coverage
          gcovr --root . --filter lib/tandem_core/ \
            --exclude-unreachable-branches --exclude-throw-branches \
            --txt \
            --json coverage/coverage.json \
            --html-details coverage/index.html

      - name: Build CI summary report
        if: success() || failure()
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ARGS=(--run-url "$RUN_URL" --marker "<!-- tandem-ci-report -->" --output test-results/ci-report.md)
          if [ -f test-results/junit.xml ]; then
            ARGS+=(--junit-xml test-results/junit.xml)
          fi
          if [ -f coverage/coverage.json ]; then
            ARGS+=(--coverage-json coverage/coverage.json)
          fi
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_SHA" ]; then
            ARGS+=(--base-ref "$BASE_SHA")
          fi
          python tools/format_coverage_summary.py "${ARGS[@]}"
          cat test-results/ci-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post or update sticky PR comment
        if: (success() || failure()) && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          COMMENT_ID=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments?per_page=100" \
            --jq '.[] | select(.body | contains("<!-- tandem-ci-report -->")) | .id' | head -n 1)
          if [ -n "$COMMENT_ID" ]; then
            gh api --method PATCH "repos/${REPO}/issues/comments/${COMMENT_ID}" -F body=@test-results/ci-report.md >/dev/null
          else
            gh api --method POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -F body=@test-results/ci-report.md >/dev/null
          fi

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: tandem-core-coverage-html
          path: coverage/
          retention-days: 14

  firmware-builds:
    name: Firmware Builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO & pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-fw-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-fw-

      - name: Cache PlatformIO build objects
        uses: actions/cache@v4
        with:
          path: ~/.pio-build-cache
          key: ${{ runner.os }}-pio-build-cache-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: python -m pip install --upgrade pip platformio

      - name: Build default firmware environments
        run: |
          mkdir -p "$HOME/.pio-build-cache"
          PLATFORMIO_BUILD_CACHE_DIR="$HOME/.pio-build-cache" pio run
