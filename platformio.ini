; T.A.N.D.E.M. PlatformIO configuration
; Pure C++ core lives in lib/tandem_core/ and is verified natively with:
;   pio test -e native
; Independent firmware apps/experiments live under src/apps/<name>/ and are
; selected per environment via build_src_filter.

[platformio]
extra_configs = platformio_local.ini
default_envs =
    esp32_wroom_stick
    esp32_s2_stick
    esp32_s2_base_station
    esp32_s3_stick
    esp32_s3_base_station

[env]
monitor_speed = 115200
extra_scripts = pre:tools/git_version.py
build_flags =
    -Wall
    -Wextra

[env:native]
platform = native
test_framework = unity
build_flags =
    ${env.build_flags}
    -Wpedantic

[env:native_cov]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -O0
    -g
    --coverage
    -lgcov

[esp32_base]
platform = espressif32 @ ~8.0.0
framework = arduino
build_flags =
    ${env.build_flags}

[env:esp32_s3_stick]
extends = esp32_base
board = esp32-s3-devkitc-1
lib_ldf_mode = deep
build_src_filter =
    -<*>
    +<apps/stick/>
build_unflags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    ${esp32_base.build_flags}
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DTANDEM_BOARD_ESP32_S3
    -DTANDEM_STICK_ID=1
    -DTANDEM_ESPNOW_CHANNEL=1
    -DTANDEM_ESPNOW_TX_HZ=250

[env:esp32_wroom_stick]
extends = esp32_base
board = esp32dev
board_build.partitions = huge_app.csv
lib_ldf_mode = deep
build_src_filter =
    -<*>
    +<apps/stick/>
build_flags =
    ${esp32_base.build_flags}
    -DTANDEM_BOARD_ESP32_WROOM
    -DTANDEM_STICK_ID=1
    -DTANDEM_ESPNOW_CHANNEL=1
    -DTANDEM_ESPNOW_TX_HZ=250

[env:esp32_wroom_stick_right]
extends = env:esp32_wroom_stick
build_flags =
    ${esp32_base.build_flags}
    -DTANDEM_BOARD_ESP32_WROOM
    -DTANDEM_STICK_ID=2
    -DTANDEM_ESPNOW_CHANNEL=1
    -DTANDEM_ESPNOW_TX_HZ=250

[env:esp32_s2_stick]
extends = esp32_base
board = lolin_s2_mini
lib_ldf_mode = deep
build_src_filter =
    -<*>
    +<apps/stick/>
build_unflags =
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    ${esp32_base.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DTANDEM_BOARD_ESP32_S2
    -DTANDEM_STICK_ID=1
    -DTANDEM_ESPNOW_CHANNEL=1
    -DTANDEM_ESPNOW_TX_HZ=250

[env:esp32_s2_base_station]
extends = esp32_base
board = lolin_s2_mini
lib_ldf_mode = deep
build_src_filter =
    -<*>
    +<apps/base_station/>
build_unflags =
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    ${esp32_base.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DTANDEM_BOARD_ESP32_S2
    -DTANDEM_ESPNOW_CHANNEL=1
    -DTANDEM_FAILSAFE_TIMEOUT_MS=200

[env:esp32_s2_base_station_combined]
extends = env:esp32_s2_base_station
build_flags =
    ${env:esp32_s2_base_station.build_flags}
    -DTANDEM_BASE_COMBINED_MODE=1

[env:esp32_s3_base_station]
extends = esp32_base
board = esp32-s3-devkitc-1
lib_ldf_mode = deep
build_src_filter =
    -<*>
    +<apps/base_station/>
build_unflags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    ${esp32_base.build_flags}
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DTANDEM_BOARD_ESP32_S3
    -DTANDEM_ESPNOW_CHANNEL=1
    -DTANDEM_FAILSAFE_TIMEOUT_MS=200
