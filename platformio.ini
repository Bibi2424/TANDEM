; T.A.N.D.E.M. PlatformIO configuration
; Pure C++ core lives in lib/tandem_core/ and is verified natively with:
;   pio test -e native
; Independent firmware apps/experiments live under src/apps/<name>/ and are
; selected per environment via build_src_filter.

[platformio]
default_envs =
    esp32_wroom_input_diag
    esp32_wroom_ble_hid
    esp32_wroom_espnow_tx
    esp32_s2_input_diag
    esp32_s2_usb_hid
    esp32_s2_base_station

[env]
monitor_speed = 115200
build_flags =
    -Wall
    -Wextra

[env:native]
platform = native
test_framework = unity
build_flags =
    ${env.build_flags}
    -Wpedantic

[esp32_base]
platform = espressif32 @ ~8.0.0
framework = arduino
build_flags =
    ${env.build_flags}

[env:esp32_wroom_input_diag]
extends = esp32_base
board = esp32dev
build_src_filter =
    -<*>
    +<apps/input_diag/>
build_flags =
    ${esp32_base.build_flags}
    -DTANDEM_BOARD_ESP32_WROOM

[env:esp32_s2_input_diag]
extends = esp32_base
board = lolin_s2_mini
build_src_filter =
    -<*>
    +<apps/input_diag/>
build_flags =
    ${esp32_base.build_flags}
    -DTANDEM_BOARD_ESP32_S2

[env:esp32_s2_usb_hid]
extends = esp32_base
board = lolin_s2_mini
lib_ldf_mode = deep
build_src_filter =
    -<*>
    +<apps/usb_hid/>
build_flags =
    ${esp32_base.build_flags}
    -DTANDEM_BOARD_ESP32_S2

[env:esp32_wroom_ble_hid]
extends = esp32_base
board = esp32dev
lib_ldf_mode = deep
build_src_filter =
    -<*>
    +<apps/ble_hid/>
build_flags =
    ${esp32_base.build_flags}
    -DTANDEM_BOARD_ESP32_WROOM

[env:esp32_wroom_espnow_tx]
extends = esp32_base
board = esp32dev
lib_ldf_mode = deep
build_src_filter =
    -<*>
    +<apps/espnow_tx/>
build_flags =
    ${esp32_base.build_flags}
    -DTANDEM_BOARD_ESP32_WROOM
    -DTANDEM_ESPNOW_STICK_ID=1
    -DTANDEM_ESPNOW_CHANNEL=1
    -DTANDEM_ESPNOW_TX_HZ=250

[env:esp32_wroom_espnow_tx_right]
extends = esp32_base
board = esp32dev
lib_ldf_mode = deep
build_src_filter =
    -<*>
    +<apps/espnow_tx/>
build_flags =
    ${esp32_base.build_flags}
    -DTANDEM_BOARD_ESP32_WROOM
    -DTANDEM_ESPNOW_STICK_ID=2
    -DTANDEM_ESPNOW_CHANNEL=1
    -DTANDEM_ESPNOW_TX_HZ=250

[env:esp32_s2_base_station]
extends = esp32_base
board = lolin_s2_mini
lib_ldf_mode = deep
build_src_filter =
    -<*>
    +<apps/base_station/>
build_flags =
    ${esp32_base.build_flags}
    -DTANDEM_BOARD_ESP32_S2
    -DTANDEM_ESPNOW_CHANNEL=1
    -DTANDEM_FAILSAFE_TIMEOUT_MS=200

[env:esp32_s2_base_station_combined]
extends = env:esp32_s2_base_station
build_flags =
    ${env:esp32_s2_base_station.build_flags}
    -DTANDEM_BASE_COMBINED_MODE=1
