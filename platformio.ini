; T.A.N.D.E.M. PlatformIO configuration
; Pure C++ core lives in lib/tandem_core/ and is verified natively with:
;   pio test -e native
; Independent firmware apps/experiments live under src/apps/<name>/ and are
; selected per environment via build_src_filter.

[platformio]
default_envs =
    esp32_wroom_bringup
    esp32_s2_bringup

[env]
monitor_speed = 115200
build_flags =
    -Wall
    -Wextra

[env:native]
platform = native
test_framework = unity
build_flags =
    ${env.build_flags}
    -Wpedantic

[esp32_base]
platform = espressif32 @ ~8.0.0
framework = arduino
build_flags =
    ${env.build_flags}

[env:esp32_wroom_bringup]
extends = esp32_base
board = esp32dev
build_src_filter =
    -<*>
    +<apps/bringup/>
build_flags =
    ${esp32_base.build_flags}
    -DTANDEM_BOARD_ESP32_WROOM

[env:esp32_s2_bringup]
extends = esp32_base
board = lolin_s2_mini
build_src_filter =
    -<*>
    +<apps/bringup/>
build_flags =
    ${esp32_base.build_flags}
    -DTANDEM_BOARD_ESP32_S2
